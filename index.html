<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анкета наблюдателя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* --d — «уровень тревоги» от 0 до 1. JS повышает его по мере чтения. */
@property --d { syntax: '<number>'; inherits: true; initial-value: 0; }

:root {
  --d: 0;
  --calm: #151a1b;      /* холодный сланец */
  --blood: #1f0808;     /* запёкшаяся кровь */
  --ink-calm: #bfbdb3;  /* кость */
  --ink-deep: #a0675e;  /* выцветшая ржавчина */
  --bg: color-mix(in srgb, var(--calm), var(--blood) calc(var(--d) * 100%));
  --ink: color-mix(in srgb, var(--ink-calm), var(--ink-deep) calc(var(--d) * 100%));
  --line: color-mix(in srgb, #3a4143, #7a2220 calc(var(--d) * 100%));
  transition: --d 1.8s ease;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font: 300 1.125rem/1.75 'Spectral', Georgia, serif;
  padding: 0 1.25rem 6rem;
}
main { max-width: 38rem; margin: 0 auto; }

/* Виньетка, зерно и мерцание */
body::before, body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
body::before {
  background: radial-gradient(ellipse at 50% 45%,
    transparent calc(62% - var(--d) * 38%),
    rgba(0,0,0, calc(.5 + var(--d) * .48)) 100%);
}
body::after {
  opacity: calc(.07 + var(--d) * .16); mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
body.deep::before { animation: flick 7s infinite; }
@keyframes flick {
  0%, 89%, 93%, 100% { opacity: 1; }
  90% { opacity: .78; } 91% { opacity: 1; } 92% { opacity: .62; }
}

header { padding: 22vh 0 3rem; }
h1 {
  margin: 0 0 1rem; font-weight: 700; font-size: clamp(2.2rem, 8vw, 3.6rem);
  line-height: 1.05; letter-spacing: calc(-.01em + var(--d) * .06em);
  text-shadow: calc(var(--d) * -2px) 0 rgba(150,20,20,calc(var(--d) * .7)),
               calc(var(--d) * 2px) 0 rgba(40,110,120,calc(var(--d) * .5));
}
.lead { margin: 0; font-style: italic; opacity: .8; }

/* Плашки */
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
.card {
  --k: 0; /* глубина плашки 0..1, задаётся в разметке */
  display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit;
  background: rgba(255,255,255, calc(.025 - var(--k) * .02));
  border: 1px solid color-mix(in srgb, var(--line), #8a2623 calc(var(--k) * 60%));
  border-left-width: calc(2px + var(--k) * 6px);
  padding: 1rem 1.25rem; transition: background .3s, transform .3s, border-color .3s;
}
.card:hover { background: rgba(120,20,20,.12); transform: translateX(calc(4px + var(--k) * 6px)); }
.card:focus-visible, .btn:focus-visible { outline: 2px solid #c9b99a; outline-offset: 3px; }
.card b { display: block; font-weight: 700; font-size: 1.1rem; }
.card span { font-size: .95rem; opacity: .65; font-style: italic; }
.card.seen { opacity: .5; }
.card.seen b::after { content: ' — прочитано'; font-weight: 300; font-style: italic; font-size: .85rem; }
.card[aria-current="true"] { border-color: #a3342a; opacity: 1; }

/* Читалка */
#reader { margin-top: 3rem; min-height: 4rem; scroll-margin-top: 2rem; }
#reader article { animation: in 1.2s ease both; }
@keyframes in { from { opacity: 0; filter: blur(5px); } to { opacity: 1; filter: none; } }
#reader h2 { font-size: 1.7rem; margin: 0 0 1.2rem; font-weight: 700; }
#reader p { margin: 0 0 1.2rem; }
#reader p.whisper { font-style: italic; letter-spacing: .04em; color: #b04a3e; }
.nav { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 2rem; }
.btn {
  background: none; color: inherit; font: inherit; cursor: pointer;
  border: 1px solid var(--line); padding: .5rem 1.1rem; transition: background .3s, border-color .3s;
}
.btn:hover { background: rgba(120,20,20,.2); border-color: #a3342a; }
.meter { margin-top: 4rem; font-size: .9rem; font-style: italic; opacity: .55; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  :root { transition: none; }
  body.deep::before, #reader article { animation: none; }
  .card { transition: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Анкета наблюдателя</h1>
    <p class="lead">Заполняйте по порядку. Не пропускайте пункты.</p>
  </header>

  <ul class="cards" id="cards"></ul>
  <div id="reader" tabindex="-1" aria-live="polite"></div>
  <p class="meter" id="meter"></p>
</main>

<script>
/* ===== ТЕКСТЫ: меняйте здесь =====
   title — заголовок плашки, hint — подпись, text — абзацы,
   whisper: true — абзац выделяется как «шёпот» */
const entries = [
  { title: 'Прибытие', hint: 'Дом на Заречной, 14',
    text: ['Вы приехали в четверг, около шести. Ключ лежал там, где обещали, под третьим кирпичом слева от крыльца.',
           'В доме было тепло. Это странно: печь не топили с осени.'] },
  { title: 'Соседи', hint: 'Они вежливы',
    text: ['Соседка слева приходит с банкой варенья. Она не заходит и смотрит поверх вашего плеча, в коридор.',
           'Она спрашивает: «Вы уже слышали, как он ходит?» Вы отвечаете, что живёте один.',
           'Она кивает, как будто это и есть ответ.'] },
  { title: 'Первая ночь', hint: 'Запишите, что услышали',
    text: ['В два часа ночи заскрипела лестница. Ступени считают шаги, а не вес.',
           'Вы насчитали одиннадцать. В доме всего десять ступеней.',
           { whisper: 'Одиннадцатая — для того, кто идёт следом.' }] },
  { title: 'Подвал', hint: 'Дверь не была заперта',
    text: ['Дверь в подвал открыта, хотя вы помните, что закрывали её дважды. Внизу пахнет сырой землёй и воском.',
           'На стене вы находите отметки. Это не календарь. Это рост: от колена до самого потолка, и каждая следующая выше предыдущей.',
           { whisper: 'Последняя отметка сделана сегодня.' }] },
  { title: 'Зеркало', hint: 'Не смотрите слишком долго',
    text: ['В прихожей висит зеркало в тёмной раме. Вы повесили его сами, но не помните, когда.',
           'Отражение запаздывает. Совсем чуть-чуть, на долю вдоха. Потом вы замечаете, что оно перестало повторять и начало ждать.',
           { whisper: 'Оно ждёт, когда вы отвернётесь.' }] },
  { title: 'Вы', hint: 'Последний пункт анкеты',
    text: ['Вы дочитали до конца. Хорошо. Он тоже следил за вами по строчкам.',
           'В графе «наблюдатель» стоит ваше имя. Чернила ещё не высохли.',
           { whisper: 'Не оборачивайтесь. Просто закройте страницу. Он уже закрыл дверь.' }] }
];

const cards = document.getElementById('cards');
const reader = document.getElementById('reader');
const meter = document.getElementById('meter');
const seen = new Set();
let deepest = -1;

entries.forEach((e, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.className = 'card';
  b.style.setProperty('--k', (i / (entries.length - 1)).toFixed(2));
  b.innerHTML = '<b></b><span></span>';
  b.firstChild.textContent = e.title;
  b.lastChild.textContent = e.hint;
  b.addEventListener('click', () => open(i));
  li.appendChild(b); cards.appendChild(li);
});

function setDread() {
  const d = deepest < 0 ? 0 : (deepest + 1) / entries.length;
  document.documentElement.style.setProperty('--d', d.toFixed(2));
  document.body.classList.toggle('deep', d > 0.5);
  meter.textContent = seen.size
    ? 'Прочитано пунктов: ' + seen.size + ' из ' + entries.length + '.'
    : '';
}

function open(i, fromHash) {
  const e = entries[i];
  seen.add(i); deepest = Math.max(deepest, i);
  [...cards.querySelectorAll('.card')].forEach((c, j) => {
    c.classList.toggle('seen', seen.has(j) && j !== i);
    c.toggleAttribute('aria-current', j === i);
    if (j === i) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
  });

  const art = document.createElement('article');
  const h = document.createElement('h2'); h.textContent = e.title; art.appendChild(h);
  e.text.forEach(t => {
    const p = document.createElement('p');
    if (typeof t === 'string') p.textContent = t;
    else { p.textContent = t.whisper; p.className = 'whisper'; }
    art.appendChild(p);
  });

  const nav = document.createElement('div'); nav.className = 'nav';
  if (i < entries.length - 1) {
    const n = document.createElement('button'); n.className = 'btn';
    n.textContent = 'Следующий пункт';
    n.onclick = () => open(i + 1); nav.appendChild(n);
  }
  const up = document.createElement('button'); up.className = 'btn';
  up.textContent = 'К списку';
  up.onclick = () => cards.scrollIntoView(); nav.appendChild(up);
  art.appendChild(nav);

  reader.replaceChildren(art);
  history.replaceState(null, '', '#p' + (i + 1));
  setDread();
  if (!fromHash) reader.scrollIntoView(); reader.focus({ preventScroll: true });
}

const m = location.hash.match(/^#p(\d+)$/);
if (m && entries[m[1] - 1]) open(m[1] - 1, true);
</script>
</body>
</html>
