<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анкета наблюдателя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Marck+Script&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
@property --d { syntax: '<number>'; inherits: true; initial-value: 0; }
:root {
  --d: 0;
  --calm: #0f1112; --blood: #1c0505;
  --bone: #d4cdc0; --rust: #b3574b;
  --bg: color-mix(in srgb, var(--calm), var(--blood) calc(var(--d) * 100%));
  --ink: color-mix(in srgb, var(--bone), var(--rust) calc(var(--d) * 70%));
  --line: color-mix(in srgb, #4a4f50, #8f2420 calc(var(--d) * 100%));
  --red: #b1231d;
  --hand: 'Caveat', 'Segoe Script', cursive;
  --script: 'Marck Script', 'Segoe Script', cursive;
  --serif: 'Playfair Display', Georgia, serif;
  transition: --d 2s ease;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.45rem/1.45 var(--hand); overflow-x: hidden; }
body.locked { overflow: hidden; }
main { max-width: 64rem; margin: 0 auto; padding: 0 1.1rem 6rem; }

/* Виньетка, зерно, красное свечение, мерцание */
body::before, body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 20; }
body::before { background: radial-gradient(ellipse at 50% 45%, transparent calc(58% - var(--d) * 38%), rgba(0,0,0, calc(.55 + var(--d) * .43)) 100%); }
body::after { opacity: calc(.08 + var(--d) * .16); mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
body.deep::before { animation: flick 6s infinite; }
@keyframes flick { 0%,88%,93%,100% { opacity: 1 } 89% { opacity: .75 } 90% { opacity: 1 } 91% { opacity: .55 } }
.glow { position: fixed; inset: -10%; z-index: 0; pointer-events: none; filter: blur(70px); opacity: calc(var(--d) * .65);
  background: radial-gradient(circle at 15% 85%, #7a0f0f 0, transparent 40%), radial-gradient(circle at 88% 20%, #5c0a0a 0, transparent 38%); animation: breathe 5s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: scale(1.12); } }
main, nav { position: relative; z-index: 2; }
.eyes { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.eyes b { position: absolute; display: flex; gap: 16px; opacity: 0; transition: opacity 2s; animation: blink 6s infinite; }
.eyes b.on { opacity: .9; }
.eyes i { width: 11px; height: 6px; border-radius: 50%; background: radial-gradient(circle, #c01010 0 28%, #ddd 32% 60%, transparent 66%); }
@keyframes blink { 0%,94%,100% { transform: scaleY(1) } 96% { transform: scaleY(.05) } }

/* Верхняя строка навигации */
nav { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; justify-content: center; gap: clamp(.8rem, 4vw, 2.4rem);
  padding: .7rem 1rem; background: rgba(0,0,0,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
nav a, nav button { color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; font: 700 .95rem var(--serif); letter-spacing: .08em; opacity: .8; padding: .2rem; }
nav a:hover, nav button:hover { opacity: 1; color: #d6453b; }
nav :focus-visible, .card:focus-visible, .btn:focus-visible, .gate:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
#count { font: 400 1.1rem var(--hand); opacity: .7; display: flex; align-items: center; gap: .4rem; }
#count::before { content: ''; width: .55rem; height: .55rem; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse calc(3.2s - var(--d) * 2.4s) infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* Шапка */
header { padding: 16vh 0 3.5rem; text-align: center; }
h1 { margin: 0; font: 900 clamp(2.6rem, 11vw, 5.8rem)/1 var(--serif); letter-spacing: calc(var(--d) * .05em);
  text-shadow: 0 0 calc(var(--d) * 22px) rgba(190,20,20,.8), calc(var(--d) * -3px) 0 rgba(160,20,20,.6), calc(var(--d) * 3px) 0 rgba(40,110,120,.4); }
.lead { margin: 1.2rem auto 0; max-width: 28rem; font-size: 1.6rem; opacity: .8; }
.orn { margin: 1.6rem 0 0; letter-spacing: .6em; color: var(--red); opacity: .8; }

/* Плашки: коллаж */
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.6rem; }
.cards li:nth-child(odd) { margin-right: 9%; transform: rotate(-1.4deg); }
.cards li:nth-child(even) { margin-left: 9%; transform: rotate(1.1deg); }
.card { --k: 0; position: relative; display: block; width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; overflow: hidden;
  padding: 1.5rem 1.4rem 1.3rem; background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(0,0,0,.35));
  border: 1px solid color-mix(in srgb, var(--line), #a02a24 calc(var(--k) * 70%));
  box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 7px color-mix(in srgb, var(--line), #a02a24 calc(var(--k) * 70%)), 0 12px 30px rgba(0,0,0,.6);
  transition: transform .4s, filter .6s, box-shadow .4s; }
.card::before { content: attr(data-n); position: absolute; right: .8rem; top: -.6rem; font: 900 5.5rem/1 var(--serif); opacity: calc(.06 + var(--k) * .1); color: #a02a24; }
.card b { display: block; position: relative; font: 900 1.7rem/1.1 var(--serif); }
.card .h { display: block; margin-top: .3rem; opacity: .75; }
.card .s { display: block; margin-top: .8rem; font: 400 1.25rem var(--script); color: #c23a30; transform: rotate(-2deg); transform-origin: left; }
.card:hover, .card:focus-visible { transform: scale(1.03); filter: none !important; box-shadow: inset 0 0 0 6px var(--bg), inset 0 0 0 7px #a02a24, 0 0 40px rgba(160,20,20,.35); }
.card.far { filter: blur(2.4px) saturate(.5); }
.card.seen { opacity: .55; }
.card[aria-current] { opacity: 1; border-color: #c23a30; }
@media (min-width: 760px) {
  .cards { grid-template-columns: repeat(12, 1fr); gap: 2.2rem 1.2rem; }
  .cards li { margin: 0 !important; }
  .cards li:nth-child(1) { grid-column: 1 / 6; }
  .cards li:nth-child(2) { grid-column: 6 / 13; margin-top: 3.2rem !important; transform: rotate(1.3deg); }
  .cards li:nth-child(3) { grid-column: 2 / 8; transform: rotate(-.8deg); }
  .cards li:nth-child(4) { grid-column: 8 / 13; margin-top: -1.2rem !important; transform: rotate(1.8deg); }
  .cards li:nth-child(5) { grid-column: 1 / 7; margin-top: 1rem !important; transform: rotate(1deg); }
  .cards li:nth-child(6) { grid-column: 7 / 13; margin-top: 2.6rem !important; transform: rotate(-1.6deg); }
}

/* Читалка: чья-то записка */
#reader { margin: 3.5rem auto 0; max-width: 40rem; scroll-margin-top: 5rem; }
#reader article { position: relative; padding: 2rem 1.6rem 1.6rem; transform: rotate(-.5deg); animation: in 1.4s ease both;
  background: repeating-linear-gradient(transparent 0 2.07rem, rgba(255,255,255,.07) 2.07rem 2.14rem), rgba(255,255,255,.045);
  border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.65); font-size: 1.55rem; line-height: 2.14rem; }
#reader article::before { content: ''; position: absolute; top: -.8rem; left: 38%; width: 6rem; height: 1.5rem; background: rgba(190,175,150,.18); transform: rotate(-3deg); }
@keyframes in { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
#reader h2 { margin: 0 0 1rem; font: 900 2rem/1.1 var(--serif); }
#reader p { margin: 0 0 1rem; }
#reader p:nth-of-type(even) { margin-left: 1rem; }
mark { background: linear-gradient(transparent 60%, rgba(160,20,20,.6) 60% 85%, transparent 85%); color: #efe6d8; }
.whisper { font: 400 1.7rem/1.3 var(--script); color: #d23a30; text-shadow: 0 0 12px rgba(200,20,20,.6); animation: shiver 3s infinite; }
@keyframes shiver { 0%,100% { filter: blur(0); } 50% { filter: blur(1.4px); transform: translateX(1px); } }
.nav2 { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 1.4rem; }
.btn { background: none; color: inherit; font: 700 1.2rem var(--hand); cursor: pointer; border: 1px solid var(--line); padding: .3rem 1.1rem; transition: .3s; }
.btn:hover { background: rgba(140,20,20,.3); border-color: #c23a30; }

/* Заметки */
#notes { margin-top: 6rem; }
#notes h2 { font: 900 2.2rem var(--serif); text-align: center; margin: 0 0 2rem; }
.scraps { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6rem; }
.scrap { max-width: 15rem; padding: 1.1rem 1.2rem; background: rgba(255,255,255,.045); border: 1px solid var(--line); box-shadow: 0 10px 24px rgba(0,0,0,.6); }
.scrap:nth-child(1) { transform: rotate(-3deg); }
.scrap:nth-child(2) { transform: rotate(2deg) translateY(1.2rem); }
.scrap:nth-child(3) { transform: rotate(-1.5deg); }
.scrap.r { color: #d2423a; font-family: var(--script); }
.meter { margin: 4rem 0 0; text-align: center; opacity: .5; }

/* Заставка */
.gate { position: fixed; inset: 0; z-index: 100; border: 0; width: 100%; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
  background: radial-gradient(circle at 50% 50%, #1a0303 0, #000 65%); color: var(--bone); transition: opacity 1.8s, filter 1.8s; }
.gate.out { opacity: 0; filter: blur(16px); pointer-events: none; }
.gate.gone { display: none; }
.phrase { font: 400 clamp(3.2rem, 15vw, 8rem)/1 var(--script); text-shadow: 0 0 30px rgba(190,20,20,.7); padding: 0 .3em;
  -webkit-mask-image: linear-gradient(90deg, #000 33%, transparent 66%); mask-image: linear-gradient(90deg, #000 33%, transparent 66%);
  -webkit-mask-size: 300% 100%; mask-size: 300% 100%; animation: write 3.6s ease-out forwards, throb 4s 3.6s infinite; }
@keyframes write { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; filter: blur(5px); } to { -webkit-mask-position: 0 0; mask-position: 0 0; filter: blur(0); } }
@keyframes throb { 50% { text-shadow: 0 0 55px rgba(220,20,20,.95); } }
.enter { font: 400 1.5rem var(--hand); opacity: 0; animation: show 2s 4.2s forwards; letter-spacing: .15em; }
@keyframes show { to { opacity: .6; } }
body.in main { animation: emerge 2.6s ease both; }
@keyframes emerge { from { filter: blur(10px); opacity: 0; } to { filter: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; } :root { transition: none; }
  .phrase { animation: none; -webkit-mask-image: none; mask-image: none; }
  .enter { animation: none; opacity: .6; }
  body.deep::before, .glow, .whisper, .eyes b, #reader article, body.in main, #count::before { animation: none; }
}
</style>
</head>
<body class="locked">
<div class="glow"></div>
<div class="eyes" id="eyes" aria-hidden="true"></div>

<button class="gate" id="gate" aria-label="Войти на страницу">
  <span class="phrase" id="phrase">Они смотрят</span>
  <span class="enter" id="enter">войти</span>
</button>

<nav>
  <a href="#top">Начало</a>
  <a href="#cards">Плашки</a>
  <a href="#notes">Заметки</a>
  <button id="exit" type="button">Выйти</button>
  <span id="count" aria-label="Прочитано">0/6</span>
</nav>

<main id="top">
  <header>
    <h1>Анкета наблюдателя</h1>
    <p class="lead">Заполняйте по порядку. Не пропускайте пункты. И не оборачивайтесь.</p>
    <p class="orn" aria-hidden="true">✦ ✦ ✦</p>
  </header>

  <ul class="cards" id="cards"></ul>
  <div id="reader" tabindex="-1" aria-live="polite"></div>

  <section id="notes">
    <h2>Чужие заметки</h2>
    <div class="scraps">
      <p class="scrap">Не считайте ступени. Я считал и перестал.</p>
      <p class="scrap r">Дверь вела обратно в прихожую. Все четыре раза.</p>
      <p class="scrap">Если услышите своё имя, не отвечайте.</p>
    </div>
  </section>
  <p class="meter" id="meter"></p>
</main>

<script>
/* ===== ТЕКСТЫ: меняйте здесь =====
   *слово* — красное подчёркивание, как будто выделили маркером
   { whisper: '...' } — красная строка, которая дрожит */
const entries = [
  { title: 'Прибытие', hint: 'Дом на Заречной, 14', scrawl: 'дверь была открыта',
    text: ['Вы приехали в четверг, около шести. Ключ лежал под *третьим кирпичом* слева от крыльца.',
           'В доме было тепло. Это странно: печь не топили с осени.'] },
  { title: 'Соседи', hint: 'Они вежливы', scrawl: 'она смотрит в коридор',
    text: ['Соседка слева приходит с банкой варенья. Она не заходит и смотрит поверх вашего плеча.',
           'Она спрашивает: «Вы уже слышали, как *он ходит*?» Вы отвечаете, что живёте один.',
           'Она кивает, как будто это и есть ответ.'] },
  { title: 'Первая ночь', hint: 'Запишите, что услышали', scrawl: 'их было одиннадцать',
    text: ['В два часа ночи заскрипела лестница. Ступени считают шаги, а не вес.',
           'Вы насчитали *одиннадцать*. В доме всего десять ступеней.',
           { whisper: 'Одиннадцатая — для того, кто идёт следом.' }] },
  { title: 'Подвал', hint: 'Дверь не была заперта', scrawl: 'внизу кто-то дышит',
    text: ['Дверь в подвал открыта, хотя вы закрывали её дважды. Внизу пахнет сырой землёй и воском.',
           'На стене отметки. Это не календарь, это *рост*: от колена до самого потолка, и каждая выше предыдущей.',
           { whisper: 'Последняя отметка сделана сегодня.' }] },
  { title: 'Зеркало', hint: 'Не смотрите слишком долго', scrawl: 'оно не моргает',
    text: ['В прихожей висит зеркало в тёмной раме. Вы повесили его сами, но не помните, когда.',
           'Отражение запаздывает на долю вдоха. Потом вы замечаете, что оно перестало повторять и начало *ждать*.',
           { whisper: 'Оно ждёт, когда вы отвернётесь.' }] },
  { title: 'Вы', hint: 'Последний пункт анкеты', scrawl: 'оглянись',
    text: ['Вы дочитали до конца. Хорошо. Он тоже следил за вами *по строчкам*.',
           'В графе «наблюдатель» стоит ваше имя. Чернила ещё не высохли.',
           { whisper: 'Не оборачивайтесь. Просто закройте страницу. Он уже закрыл дверь.' }] }
];
const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
const $ = id => document.getElementById(id);
const cards = $('cards'), reader = $('reader'), meter = $('meter'), count = $('count');
const seen = new Set(); let deepest = -1;

/* Заставка */
const gate = $('gate'), phrase = $('phrase');
function enter() {
  gate.classList.add('out');
  document.body.classList.remove('locked');
  document.body.classList.add('in');
  setTimeout(() => gate.classList.add('gone'), 1900);
}
gate.addEventListener('click', enter);
$('exit').addEventListener('click', () => {
  phrase.textContent = 'Поздно';
  $('enter').textContent = 'вернуться';
  phrase.style.animation = 'none'; void phrase.offsetWidth; phrase.style.animation = '';
  gate.classList.remove('gone'); void gate.offsetWidth; gate.classList.remove('out');
  document.body.classList.add('locked');
});

/* Глаза в темноте: появляются по мере роста тревоги */
const eyes = $('eyes'), pairs = [];
[[3,12],[93,25],[6,48],[91,62],[4,80],[94,88],[48,96],[50,3]].forEach(([x, y], n) => {
  const b = document.createElement('b');
  b.style.cssText = `left:${x}%;top:${y}%;animation-delay:${n * 0.9}s`;
  b.innerHTML = '<i></i><i></i>'; eyes.appendChild(b); pairs.push(b);
});

/* Плашки */
entries.forEach((e, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.className = 'card'; b.dataset.n = roman[i];
  b.style.setProperty('--k', (i / (entries.length - 1)).toFixed(2));
  b.innerHTML = '<b></b><span class="h"></span><span class="s"></span>';
  b.children[0].textContent = e.title;
  b.children[1].textContent = e.hint;
  b.children[2].textContent = e.scrawl;
  b.addEventListener('click', () => open(i));
  li.appendChild(b); cards.appendChild(li);
});

function setDread() {
  const d = deepest < 0 ? 0 : (deepest + 1) / entries.length;
  document.documentElement.style.setProperty('--d', d.toFixed(2));
  document.body.classList.toggle('deep', d > 0.5);
  pairs.forEach((p, n) => p.classList.toggle('on', d > (n + 1) / (pairs.length + 1)));
  [...cards.querySelectorAll('.card')].forEach((c, j) => c.classList.toggle('far', j > deepest + 1));
  count.textContent = seen.size + '/' + entries.length;
  meter.textContent = seen.size === entries.length ? 'Вы прочли всё. Теперь они знают, как вы читаете.' : '';
}

function line(text) { // *слово* -> <mark>
  const p = document.createElement('p');
  text.split('*').forEach((part, k) => {
    if (k % 2) { const m = document.createElement('mark'); m.textContent = part; p.appendChild(m); }
    else p.appendChild(document.createTextNode(part));
  });
  return p;
}

function open(i, fromHash) {
  const e = entries[i];
  seen.add(i); deepest = Math.max(deepest, i);
  [...cards.querySelectorAll('.card')].forEach((c, j) => {
    c.classList.toggle('seen', seen.has(j) && j !== i);
    if (j === i) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
  });
  const art = document.createElement('article');
  const h = document.createElement('h2'); h.textContent = e.title; art.appendChild(h);
  e.text.forEach(t => {
    if (typeof t === 'string') art.appendChild(line(t));
    else { const p = document.createElement('p'); p.className = 'whisper'; p.textContent = t.whisper; art.appendChild(p); }
  });
  const nav = document.createElement('div'); nav.className = 'nav2';
  if (i < entries.length - 1) {
    const n = document.createElement('button'); n.className = 'btn'; n.textContent = 'Дальше';
    n.onclick = () => open(i + 1); nav.appendChild(n);
  }
  const up = document.createElement('button'); up.className = 'btn'; up.textContent = 'К плашкам';
  up.onclick = () => cards.scrollIntoView(); nav.appendChild(up);
  art.appendChild(nav);
  reader.replaceChildren(art);
  history.replaceState(null, '', '#p' + (i + 1));
  setDread();
  if (!fromHash) reader.scrollIntoView();
  reader.focus({ preventScroll: true });
}

setDread();
const m = location.hash.match(/^#p(\d+)$/);
if (m && entries[m[1] - 1]) { enter(); open(m[1] - 1, true); }
</script>
</body>
</html>
